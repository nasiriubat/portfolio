name: Build and review portfolio
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Upload built site for independent review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-site-build
          path: dist/
          retention-days: 7
      - name: Install browser for visual review
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium
      - name: Capture desktop/mobile previews and check overflow
        if: github.event_name == 'pull_request'
        run: npm run test:visual
      - name: Upload visual preview screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-preview
          path: preview/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Story and Plain URLs
        run: |
          for i in $(seq 1 18); do
            if curl -fsSL --retry 2 --max-time 15 "https://nasiriubat.github.io/portfolio/" | grep -q 'id="root"' && \
               curl -fsSL --retry 2 --max-time 15 "https://nasiriubat.github.io/portfolio/?view=plain" | grep -q 'id="root"'; then
              echo "Public Story and Plain entrypoints respond"
              exit 0
            fi
            sleep 6
          done
          echo "GitHub Pages smoke check failed"; exit 1
